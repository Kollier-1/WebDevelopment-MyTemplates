<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2 - Simple Interest</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Simple Interest and Final Balance</h1>
    <p>Four-year deposit with a fixed annual rate of 6%.</p>
    <form id="calculatorForm">
      <label for="initialCapital">Initial capital ($)</label>
      <input type="number" id="initialCapital" min="0.01" step="0.01" required>
      <button type="submit">Calculate</button>
    </form>
    <section id="result" class="result" aria-live="polite"></section>
  </main>
</body>
</html>
