<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 1 - Basic Math Operations</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Basic Math Operations</h1>
    <p>Enter two numbers to see the results of five operations.</p>
    <form id="calculatorForm">
      <label for="firstNumber">First number</label>
      <input type="number" id="firstNumber" step="any" required>
      <label for="secondNumber">Second number</label>
      <input type="number" id="secondNumber" step="any" required>
      <button type="submit">Calculate</button>
    </form>
    <p class="note">Results will be displayed in alert dialogs.</p>
  </main>
</body>
</html>
